[project]
name = "qa-rag"
version = "0.1.0"
description = "Local, low-resource RAG backend for technical documentation and research papers."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "qdrant-client>=1.12",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.2",
    "tiktoken>=0.8",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "reportlab>=4.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: line length handled by formatter, not worth failing builds over.
# B008: FastAPI's Depends(...) in argument defaults is the required, standard
# pattern for dependency injection - not a real function-call-in-default bug.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
exclude = ["^scripts/", "^tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_ollama: requires a running Ollama instance with the configured generation model pulled",
    "slow: loads a real ML model (sentence-transformers/cross-encoder), skip for fast iteration",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
